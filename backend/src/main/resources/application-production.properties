# SteamBeta Campus · Configuración de Servidor Central de Producción
# Acceso centralizado y seguro para toda la comunidad universitaria

server.address=0.0.0.0
server.port=${PORT:8080}
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true

# Hikari Connection Pool Producción Central
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Seguridad de Errores y Cero Filtraciones
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Desactivar endpoints innecesarios
management.endpoints.enabled-by-default=false
