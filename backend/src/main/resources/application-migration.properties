spring.flyway.enabled=true
spring.main.web-application-type=none
spring.flyway.placeholders.backendLogin=${REPLICA_DB_USER}
spring.flyway.url=${REPLICA_DB_URL}
spring.flyway.user=${REPLICA_MIGRATION_USER}
spring.flyway.password=${REPLICA_MIGRATION_PASSWORD}
spring.flyway.default-schema=replica_meta
spring.flyway.schemas=replica_meta
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
