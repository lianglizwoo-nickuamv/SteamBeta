spring.application.name=replica-backend
server.address=${REPLICA_HTTP_ADDRESS:127.0.0.1}
server.port=${REPLICA_HTTP_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${REPLICA_DB_URL:jdbc:postgresql://localhost:5432/steam_academico}
spring.datasource.username=${REPLICA_DB_USER:replica_runtime}
spring.datasource.password=${REPLICA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# =============================================================================
# Configuración SMTP y Notificaciones de Campus
# =============================================================================
steambeta.mail.host=${MAIL_HOST:}
steambeta.mail.port=${MAIL_PORT:587}
steambeta.mail.username=${MAIL_USERNAME:}
steambeta.mail.password=${MAIL_PASSWORD:}
steambeta.mail.from=${MAIL_FROM:campus@steambeta.edu}
steambeta.mail.admin-notification-email=${ADMIN_NOTIFICATION_EMAIL:admin-campus@steambeta.edu}

# =============================================================================
# Almacenamiento administrado de adjuntos de Intercambio (fuera del repositorio)
# =============================================================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
steambeta.storage.exchange-dir=${STEAMBETA_EXCHANGE_STORAGE_DIR:${user.home}/.steambeta/exchange-storage}
steambeta.storage.avatar-dir=${STEAMBETA_AVATAR_STORAGE_DIR:${user.home}/.steambeta/avatar-storage}

# Modo Administrador Independiente (sin valores predeterminados ni secretos en repositorio)
steambeta.admin.key-sha256=${STEAMBETA_ADMIN_KEY_SHA256:}
steambeta.admin.key=${STEAMBETA_ADMIN_KEY:}
steambeta.admin.actor-id=${STEAMBETA_ADMIN_ACTOR_ID:}
