spring.application.name=replica-backend
server.address=${REPLICA_HTTP_ADDRESS:127.0.0.1}
server.port=${REPLICA_HTTP_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${REPLICA_DB_URL}
spring.datasource.username=${REPLICA_DB_USER}
spring.datasource.password=${REPLICA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
